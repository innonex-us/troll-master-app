name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root frontend dependencies
        run: npm ci

      - name: Install and build sidecar
        run: |
          cd sidecar
          npm ci
          npm run build

      - name: Vendor Node runtime as Tauri externalBin
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p src-tauri/binaries
          NODE_BIN=$(node -e "console.log(process.execPath)")
          TARGET_TRIPLE=$(rustc -vV | grep '^host:' | cut -d' ' -f2)
          DEST="src-tauri/binaries/jarveeauto-node-${TARGET_TRIPLE}"
          if [ "$PLATFORM" = "windows-latest" ]; then
            DEST="${DEST}.exe"
          fi
          cp "$NODE_BIN" "$DEST"
          chmod +x "$DEST" || true

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
